<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">NT// — animated pixel mark</title><desc id="desc">Pixel NT// mark in avatar-sampled off-white and sunset amber on slate navy, with violet signal lights. Animation stops for reduced-motion preferences.</desc>
<style>
  .signal { animation: signal 8s steps(20, end) infinite; }
  .scan { animation: scan 8s steps(28, end) infinite; }
  .beacon { animation: beacon 4s steps(2, end) infinite; }
  .beacon-late { animation-delay: -2s; }
  @keyframes signal { 0%, 10% {transform:translateX(0)} 80%,100% {transform:translateX(320px)} }
  @keyframes scan { 0%,12% {transform:translateY(0);opacity:0} 16% {opacity:.6} 75% {opacity:.6} 82%,100% {transform:translateY(112px);opacity:0} }
  @keyframes beacon { 0%,100% {opacity:.5} 50% {opacity:1} }
  @media (prefers-reduced-motion: reduce) { .signal,.scan,.beacon {animation:none!important} .scan {display:none} }
</style><path fill="#536077" d="M8 0h384v8h8v144h-8v8H8v-8H0V8h8z"/>
